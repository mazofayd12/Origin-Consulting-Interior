version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: origin_postgres
    restart: always
    environment:
      POSTGRES_USER: origin_user
      POSTGRES_PASSWORD: origin_secure_password_2026
      POSTGRES_DB: origin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origin_user -d origin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: origin_redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: origin_api_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://origin_user:origin_secure_password_2026@postgres:5432/origin_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super_secret_jwt_origin_2026_key_auth"
      JWT_REFRESH_SECRET: "super_secret_jwt_origin_refresh_2026"
      STORAGE_PROVIDER: "local"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: origin_next_client
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data:
  uploads_data:
